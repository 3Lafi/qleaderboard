<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>وسام — مقارنة زخرفة الوسام</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#173f32;font-family:Tahoma,Arial,sans-serif;line-height:1.7}main{max-width:1080px;margin:auto;padding:32px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:24px}h1{font-size:28px;margin:0}p{margin:8px 0 24px;color:#63736a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}article{border:1px solid #d8dfd6;border-radius:20px;padding:24px;text-align:center;background:#fff}.art{width:100%;max-width:360px;height:auto;display:block;margin:auto}h2{font-size:20px;margin:16px 0 4px}.tag{font-size:12px;background:#e7f0e8;border-radius:30px;padding:6px 12px}.sizes{display:flex;align-items:center;justify-content:center;gap:24px;min-height:112px;margin-top:20px;border-top:1px solid #d8dfd6}.sizes img{object-fit:contain}button{font:inherit;cursor:pointer;border:1px solid #c0cec2;border-radius:30px;padding:8px 18px;color:inherit;background:transparent}.dark{background:#0c201a;color:#f1eadb}.dark article{background:#143629;border-color:#375442}.dark p{color:#c0cdc2}.dark .tag{background:#31533e}.dark .sizes{border-color:#375442}@media(max-width:620px){.grid{grid-template-columns:1fr}header{align-items:start;flex-direction:column;gap:12px}h1{font-size:24px}}
</style>
<main><header><div><h1>تحسين الزخرفة النباتية</h1><p>الخط الأصلي والإطار الذهبي محفوظان في النسختين.</p></div><button type="button" id="theme" aria-pressed="false">خلفية داكنة</button></header>
<div class="grid">
<article><span class="tag">المرجع الأصلي</span><img class="art" src="../images/badges-assets/frames/quran-ornate-v6.webp" alt="وسام القرآن الكريم بالزخرفة النباتية الأصلية" width="1024" height="1024"><h2>النباتية الأصلية</h2><p>أغصان وأوراق ذهبية متداخلة كما في المرجع.</p><div class="sizes"><img src="../images/app-icons/badge-v6-32.png" width="32" height="32" alt="أيقونة بحجم ٣٢"><img src="../images/app-icons/badge-v6-192.png" width="64" height="64" alt="أيقونة بحجم ٦٤"><img src="../images/app-icons/badge-v6-192.png" width="96" height="96" alt="أيقونة بحجم ٩٦"></div></article>
<article><span class="tag">النسخة المعتمدة في التطبيق</span><img class="art" src="../images/badges-assets/frames/quran-botanical-v10.webp" alt="وسام القرآن الكريم بالزخرفة النباتية المحسنة" width="1024" height="1024"><h2>النباتية المحسّنة</h2><p>انحناءات أنعم، أوراق أوضح، وتوازن أدقّ للتفاصيل الذهبية.</p><div class="sizes"><img src="../images/app-icons/badge-v10-32.png" width="32" height="32" alt="أيقونة بحجم ٣٢"><img src="../images/app-icons/badge-v10-192.png" width="64" height="64" alt="أيقونة بحجم ٦٤"><img src="../images/app-icons/badge-v10-192.png" width="96" height="96" alt="أيقونة بحجم ٩٦"></div></article>
</div></main>
<script>document.getElementById('theme').onclick=function(){const dark=document.body.classList.toggle('dark');this.setAttribute('aria-pressed',String(dark));this.textContent=dark?'خلفية فاتحة':'خلفية داكنة'};</script>
</html>
