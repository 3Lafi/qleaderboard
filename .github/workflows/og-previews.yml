# Keeps link previews in sync with public boards. WhatsApp reads the static page
# at /b/{boardId}; it never evaluates the JavaScript application.
name: Refresh board link previews

on:
  repository_dispatch:
    types: [board-banner-saved]
  workflow_dispatch:

concurrency:
  group: board-og-previews
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prepare Firebase credentials
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Check whether a preview changed
        id: preview
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            board_id='${{ github.event.client_payload.boardId }}'
            [[ "$board_id" =~ ^[a-z0-9]{8}$ ]] || { echo "Invalid board id"; exit 1; }
            node scripts/generate-og-previews.mjs --check --board="$board_id" | tee preview.log
          else
            node scripts/generate-og-previews.mjs --check | tee preview.log
          fi
          echo "needs_work=$(sed -n 's/^needs_work=//p' preview.log)" >> "$GITHUB_OUTPUT"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json

      - name: Install browser renderer
        if: steps.preview.outputs.needs_work == 'true'
        run: npx playwright install --with-deps chromium

      - name: Generate the public board pages and images
        if: steps.preview.outputs.needs_work == 'true'
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            node scripts/generate-og-previews.mjs --board='${{ github.event.client_payload.boardId }}'
          else
            node scripts/generate-og-previews.mjs
          fi
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json

      - name: Commit generated previews
        if: steps.preview.outputs.needs_work == 'true'
        run: |
          git config user.name "wisam-preview-bot"
          git config user.email "actions@github.com"
          git add b images/og
          git diff --cached --quiet || git commit -m "Refresh board link previews"
          git push

      - name: Publish to Firebase Hosting
        if: steps.preview.outputs.needs_work == 'true'
        run: npx --yes firebase-tools@latest deploy --only hosting:wisam --project wisam-3lafi --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
