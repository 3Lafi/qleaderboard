<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مولد الأيقونة الفخمة - نسخة احترافية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <style>
        body {
            background: #093d2b; /* اللون الأخضر الداكن للثيم */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Tajawal', sans-serif;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.08); /* زجاجي خفيف */
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* المربع الأخضر - الحاوية الأساسية */
        #viewport {
            width: 512px;
            height: 512px;
            background: radial-gradient(circle, rgba(255,255,255,0.06) 2px, transparent 2px), 
                        linear-gradient(145deg, #168a5c 0%, #0a4d36 100%);
            background-size: 35px 35px, 100% 100%;
            border-radius: 120px;
            position: relative;
            overflow: visible !important; /* السماح بالتوهج بالظهور */
            margin-bottom: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        /* الإطار الذهبي الداخلي */
        #viewport::after {
            content: '';
            position: absolute;
            top: 25px; left: 25px; right: 25px; bottom: 25px;
            border: 4px solid rgba(249, 217, 118, 0.4);
            border-radius: 95px;
            pointer-events: none;
        }

        /* حاوية الأيقونة - مفتاح الحل هو الـ Padding الضخم جداً */
        .icon-safe-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 120px; /* مساحة هائلة لمنع أي قص للظل */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            overflow: visible !important;
        }

        #the-glow {
            filter: drop-shadow(0 0 40px rgba(249, 217, 118, 0.7)); /* توهج أقوى */
            display: block;
        }

        .quran-img {
            width: 240px; /* تصغير محسوب للتوهج */
            height: 240px;
            object-fit: contain;
            display: block;
        }

        .btn {
            background: linear-gradient(135deg, #d4af37 0%, #aa862e 100%);
            color: white;
            padding: 15px 40px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(212,175,55,0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="color: #d4af37; font-weight: 900; margin-top: 0;">💎 مولد الأيقونة الفخمة</h2>
        <p style="color: #cadbd4; margin-bottom: 30px;">تصميم متفرد بأعلى جودة لخدمة القرآن الكريم.</p>
        
        <div id="viewport">
            <div class="icon-safe-zone">
                <div id="the-glow">
                    <img src="images/quran-icon.png" class="quran-img">
                </div>
            </div>
        </div>

        <button class="btn" onclick="generateIcon()">📥 تحميل الأيقونة الآن (PNG)</button>
        <p id="status" style="margin-top: 15px; font-weight: bold; color: #d4af37;"></p>
    </div>

    <script>
        async function generateIcon() {
            const el = document.getElementById('viewport');
            const status = document.getElementById('status');
            status.innerText = "⏳ جاري التصدير بأعلى جودة...";
            
            try {
                await document.fonts.ready;
                
                // الحل السحري: توسيع حدود الالتقاط (Bounding Box) يدوياً قبل التقاط الصورة
                // عبر إعطاء السكربت تعليمات واضحة بالأبعاد الحقيقية
                const options = {
                    cacheBust: true,
                    pixelRatio: 2,
                    width: 512,
                    height: 512,
                    style: {
                        borderRadius: '120px' // تأكيد الحواف عند التصدير
                    }
                };

                const dataUrl = await htmlToImage.toPng(el, options);
                
                const link = document.createElement('a');
                link.download = 'quran-pure-icon.png';
                link.href = dataUrl;
                link.click();
                
                status.innerText = "✅ تم التحميل! جربها الآن.";
            } catch (error) {
                console.error(error);
                status.innerText = "❌ فشل التوليد، جرب متصفح كروم.";
            }
        }
    </script>
</body>
</html>
